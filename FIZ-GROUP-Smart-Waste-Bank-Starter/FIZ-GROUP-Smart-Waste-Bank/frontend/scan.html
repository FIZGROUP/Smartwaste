<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scan anggota | FIZ GROUP</title><link rel="stylesheet" href="app.css"></head><body><div class="shell"><aside class="sidebar"><div class="sidebrand">FIZ GROUP<small>SMART WASTE BANK</small></div><nav class="sidenav"><a href="dashboard.html">◫ Dashboard</a><a class="active" href="scan.html">▣ QR / Barcode</a><a href="#" id="out">↪ Keluar</a></nav></aside><main class="main"><div class="topline"><div><div class="muted">IDENTIFIKASI ANGGOTA</div><h1>QR & Barcode</h1></div></div><section class="panel" style="max-width:480px"><h3>Pindai kode anggota</h3><p class="muted">Arahkan kamera ke QR anggota. Scanner barcode USB dapat digunakan pada kolom kode manual.</p><div id="reader"></div><div class="field"><label>Kode anggota / barcode</label><input id="code" placeholder="Scan atau masukkan kode" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:8px"></div><button class="btn" id="lookup">Periksa kode</button><p id="result" class="muted"></p></section></main></div><script src="config.js"></script><script src="api.js"></script><script src="https://unpkg.com/html5-qrcode"></script><script>guard();out.onclick=logout;function show(v){code.value=v;result.textContent='Kode terbaca. Validasi QR/barcode ke akun anggota akan diaktifkan melalui modul API berikutnya.'}lookup.onclick=()=>show(code.value.trim());if(window.Html5Qrcode){let q=new Html5Qrcode('reader');q.start({facingMode:'environment'},{fps:10,qrbox:220},show).catch(()=>result.textContent='Kamera tidak tersedia. Masukkan kode secara manual.')}</script></body></html>
