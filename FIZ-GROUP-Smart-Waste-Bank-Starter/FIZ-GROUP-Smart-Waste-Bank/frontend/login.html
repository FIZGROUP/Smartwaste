<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk | FIZ GROUP</title><link rel="stylesheet" href="app.css"></head><body><div class="auth"><aside class="aside"><b>FIZ GROUP · SMART WASTE BANK</b><div><h1>Kelola kontribusi. Pantau setiap poin.</h1><p>Masuk untuk melihat transaksi penimbangan dan saldo poin Anda.</p></div><small>© 2026 FIZ GROUP</small></aside><main class="authmain"><form class="form" id="f"><h2>Selamat datang</h2><p class="muted">Masuk ke dashboard Smart Waste Bank.</p><div id="msg"></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn full">Masuk ke akun</button><p class="muted">Belum punya akun? <a class="link" href="register.html">Daftar sekarang</a></p></form></main></div><script src="config.js"></script><script src="api.js"></script><script>f.onsubmit=async e=>{e.preventDefault();let m=document.querySelector('#msg'),d=Object.fromEntries(new FormData(f));try{let r=await api('/auth/login',{method:'POST',body:JSON.stringify(d)});localStorage.setItem('fiz_token',r.token);localStorage.setItem('fiz_user',JSON.stringify(r.user));location.href=r.user.role==='admin'?'admin.html':'dashboard.html'}catch(x){m.className='notice error';m.textContent=x.message}}</script></body></html>
