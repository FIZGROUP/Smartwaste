<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | FIZ GROUP</title><link rel="stylesheet" href="app.css"></head><body><div class="shell"><aside class="sidebar"><div class="sidebrand">FIZ GROUP<small>SMART WASTE BANK</small></div><div class="navlabel">ADMINISTRATION</div><nav class="sidenav"><a class="active" href="admin.html">◫ Overview</a><a href="dashboard.html">Dashboard anggota</a><a href="#" id="out">↪ Keluar</a></nav></aside><main class="main"><div class="topline"><div><div class="muted">CONTROL CENTER</div><h1>Admin dashboard</h1></div><span class="muted">Administrator</span></div><div class="grid"><div class="stat"><span>Total anggota</span><strong id="users">—</strong></div><div class="stat"><span>Total transaksi</span><strong id="transactions">—</strong></div><div class="stat"><span>Total sampah</span><strong id="weight">—</strong></div></div><section class="panel"><h3>Transaksi terbaru</h3><div class="tablewrap"><table class="table"><thead><tr><th>Anggota</th><th>Jenis</th><th>Berat</th><th>Poin</th><th>Waktu</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script src="config.js"></script><script src="api.js"></script><script>guard();out.onclick=logout;async function load(){try{let d=await api('/admin/summary');users.textContent=d.total_users;transactions.textContent=d.total_transactions;weight.textContent=Number(d.total_weight).toFixed(2)+' kg';rows.innerHTML=d.recent.map(t=>`<tr><td>${t.user_name}</td><td>${t.waste_name}</td><td>${Number(t.weight_kg).toFixed(2)} kg</td><td>${t.points_earned}</td><td>${new Date(t.created_at).toLocaleString('id-ID')}</td></tr>`).join('')||'<tr><td colspan="5">Belum ada transaksi.</td></tr>'}catch(e){alert(e.message);logout()}}load()</script></body></html>
