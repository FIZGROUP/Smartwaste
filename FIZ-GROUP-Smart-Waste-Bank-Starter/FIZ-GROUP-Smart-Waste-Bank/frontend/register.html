<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar | FIZ GROUP</title><link rel="stylesheet" href="app.css"></head><body><div class="auth"><aside class="aside"><b>FIZ GROUP · SMART WASTE BANK</b><div><h1>Mulai langkah kecil untuk lingkungan.</h1><p>Buat akun anggota dan pantau berat sampah serta poin yang Anda kumpulkan.</p></div><small>© 2026 FIZ GROUP</small></aside><main class="authmain"><form class="form" id="f"><h2>Buat akun anggota</h2><p class="muted">Lengkapi data berikut untuk mendaftar.</p><div id="msg"></div><div class="field"><label>Nama lengkap</label><input name="name" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Nomor telepon</label><input name="phone"></div><div class="field"><label>Password (minimal 8 karakter)</label><input name="password" type="password" minlength="8" required></div><button class="btn full">Daftar akun</button><p class="muted">Sudah punya akun? <a class="link" href="login.html">Masuk</a></p></form></main></div><script src="config.js"></script><script src="api.js"></script><script>f.onsubmit=async e=>{e.preventDefault();let m=document.querySelector('#msg');try{await api('/auth/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});m.className='notice';m.textContent='Pendaftaran berhasil. Silakan masuk.';f.reset()}catch(x){m.className='notice error';m.textContent=x.message}}</script></body></html>
