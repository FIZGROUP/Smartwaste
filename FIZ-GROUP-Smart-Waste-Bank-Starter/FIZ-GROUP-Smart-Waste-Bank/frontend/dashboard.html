<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard Anggota</title><link rel="stylesheet" href="app.css"></head><body><div class="shell"><aside class="sidebar"><div class="sidebrand">FIZ GROUP<small>SMART WASTE BANK</small></div><div class="navlabel">MENU ANGGOTA</div><nav class="sidenav"><a class="active" href="dashboard.html">◫ Ringkasan</a><a href="scan.html">▣ QR / Barcode</a><a href="#" id="out">↪ Keluar</a></nav></aside><main class="main"><div class="topline"><div><div class="muted">AREA ANGGOTA</div><h1>Dashboard</h1></div><span id="name" class="muted">Memuat...</span></div><div class="grid"><div class="stat"><span>Total poin</span><strong id="points">—</strong></div><div class="stat"><span>Total berat</span><strong id="weight">—</strong></div><div class="stat"><span>Transaksi</span><strong id="count">—</strong></div></div><section class="panel"><h3>Riwayat penimbangan</h3><div class="tablewrap"><table class="table"><thead><tr><th>Tanggal</th><th>Jenis</th><th>Berat</th><th>Poin</th></tr></thead><tbody id="rows"><tr><td colspan="4">Memuat...</td></tr></tbody></table></div></section></main></div><script src="config.js"></script><script src="api.js"></script><script>guard();out.onclick=logout;async function load(){try{let [me,tx]=await Promise.all([api('/auth/me'),api('/transactions/mine')]);name.textContent=me.user.name;points.textContent=Number(me.user.points).toLocaleString('id-ID');weight.textContent=tx.transactions.reduce((a,t)=>a+Number(t.weight_kg),0).toFixed(2)+' kg';count.textContent=tx.transactions.length;rows.innerHTML=tx.transactions.map(t=>`<tr><td>${new Date(t.created_at).toLocaleString('id-ID')}</td><td>${t.waste_name}</td><td>${Number(t.weight_kg).toFixed(2)} kg</td><td>${t.points_earned}</td></tr>`).join('')||'<tr><td colspan="4">Belum ada transaksi.</td></tr>'}catch(e){alert(e.message);logout()}}load();setInterval(load,15000)</script></body></html>
